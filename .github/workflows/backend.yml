name: Backend CI

on:
  pull_request:
    branches: [main]
    paths: [backend/**]
  workflow_dispatch:
  workflow_call:

jobs:
  verify:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: 3.12

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      - name: Run ruff
        working-directory: backend
        run: uv run ruff check .

      - name: Run tests
        working-directory: backend
        run: uv run pytest tests/ -v