name: Release Pipeline

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
      dry-run:
        description: 'Run the release process without making any changes'
        required: true
        type: boolean
        default: false

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history for all tags and branches

      - name: Check version format
        run: |
          if [[ ! "${{ github.event.inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must be in the format X.Y.Z"
            exit 1
          fi

          NEW_VERSION="${{ github.event.inputs.version }}"
          LATEST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null)

          echo "Latest Git Tag: $LATEST_TAG"
          echo "New Version:    $NEW_VERSION"

          if [ "$LATEST_TAG" == "$NEW_VERSION" ]; then
              echo "Error: The new version is already live."
              exit 1
          elif [ "$(printf '%s\n' "$LATEST_TAG" "$NEW_VERSION" | sort -V | tail -n1)" == "$NEW_VERSION" ]; then
              echo "$NEW_VERSION is newer than $LATEST_TAG."
          else
              echo "Error: $NEW_VERSION is older than $LATEST_TAG."
              exit 1
          fi


  call-frontend-workflow:
    name: Build Frontend
    needs: check-version
    uses: ./.github/workflows/frontend.yml

  call-backend-workflow:
    name: Build Backend
    needs: check-version
    uses: ./.github/workflows/backend.yml


  integration-tests:
    name: Run Integration Tests
    needs: [call-frontend-workflow, call-backend-workflow]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: 3.12

      - name: Docker Compose Up
        run: docker compose -f workflow-docker-compose.yml up --build -d

      - name: Run Integration Tests
        working-directory: e2e
        run: |
          uv sync
          uv run playwright install chromium
          uv run playwright install-deps chromium
          uv run pytest

  release:
    name: Release
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Download frontend artifacts
        run: echo "Downloading frontend artifacts..."
      - name: Download backend artifacts
        run: echo "Downloading backend artifacts..."
      - name: Create docker images
        run: echo "Creating docker images..."
      - name: Push docker images
        run: echo "Pushing docker images..."
      - name: Create Github release
        run: echo "Creating GitHub release..."