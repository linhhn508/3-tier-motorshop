name: Release Pipeline

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
      dry-run:
        description: 'Run the release process without making any changes'
        required: true
        type: boolean
        default: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check version format
        run: |
          if [[ ! "${{ github.event.inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must be in the format X.Y.Z"
            exit 1
          fi

  call-frontend-workflow:
    name: Build Frontend
    needs: check-version
    uses: ./.github/workflows/frontend.yml

  call-backend-workflow:
    name: Build Backend
    needs: check-version
    uses: ./.github/workflows/backend.yml


  integration-tests:
    name: Run Integration Tests
    needs: [call-frontend-workflow, call-backend-workflow]
    runs-on: ubuntu-latest
    steps:
      - name: Run integration tests
        run: |
          echo "Running integration tests..."
          echo "Placeholder for actual integration test commands"

  release:
    name: Release
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Download frontend artifacts
        run: echo "Downloading frontend artifacts..."
      - name: Download backend artifacts
        run: echo "Downloading backend artifacts..."
      - name: Create docker images
        run: echo "Creating docker images..."
      - name: Push docker images
        run: echo "Pushing docker images..."
      - name: Create Github release
        run: echo "Creating GitHub release..."