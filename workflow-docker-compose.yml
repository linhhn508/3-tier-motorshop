services:
  backend:
    image: custom_backend
    build:
      context: .
      dockerfile: ./infra/Dockerfile/service/Dockerfile
    container_name: backend
    environment:
      - FLASK_APP=app
      - MARIADB_USER=admin
      - MARIADB_PASSWORD=admin123
      - MARIADB_HOST=mariadb
      - MARIADB_DATABASE=motorshop
      - JWT_SECRET=supersecretkey123
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin123
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend_network

  mariadb:
    image: custom_mariadb
    build:
      context: ./infra/Dockerfile/mariadb
      dockerfile: Dockerfile
    container_name: mariadb
    environment:
      - MARIADB_ROOT_PASSWORD=admin
      - MARIADB_DATABASE=motorshop
      - MARIADB_USER=admin
      - MARIADB_PASSWORD=admin123
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend_network

  minio:
    image: custom_minio
    build:
      context: ./infra/Dockerfile/minio
      dockerfile: Dockerfile
    container_name: minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin123
    volumes:
      - ./infra/Dockerfile/minio/product:/home/image
    healthcheck:
      test: ["CMD-SHELL", "mc alias set local http://localhost:9000 admin admin123 && mc ls local/product-image"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend_network

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - backend_network

  frontend:
    image: custom_frontend
    build:
      context: .
      dockerfile: ./infra/Dockerfile/frontend/Dockerfile
    container_name: frontend
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend_network

  reverse_proxy:
    image: custom_reverse_proxy
    build:
      context: .
      dockerfile: ./infra/Dockerfile/reverse_proxy/Dockerfile
    container_name: reverse_proxy
    ports:
      - "8000:80"
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend_network

networks:
  backend_network:
    driver: bridge