[project]
name = "motorshop-backend"
version = "0.1.0"
description = "Flask backend for Motor Shop"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-sqlalchemy>=3.1.0",
    "pymysql>=1.1.0",
    "PyJWT>=2.9.0",
    "boto3>=1.35.0",
    "gunicorn>=23.0.0",
    "flask-caching>=2.5.1",
    "redis>=8.1.0",
    "prometheus-client>=0.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
